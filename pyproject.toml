[project]
name = "pyclebsch"
version = "0.1.0"
description = "Compute SU(N) Clebsch-Gordan coefficients and other quantities useful for lattice gauge theory simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "more-itertools~=10.7",
    "numpy~=2.2",
    "scipy~=1.15",
    "tqdm~=4.67",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyclebsch*"]
